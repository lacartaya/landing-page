name: Prepare production promotion

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROMOTE to validate develop and open a PR to main
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-develop-to-main
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirm == 'PROMOTE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing is already open. Review and merge that PR, or close it before starting another promotion."
            exit 1
          fi
          gh pr create --base main --head develop \
            --title "Promote develop to production" \
            --body "Manual promotion requested from GitHub Actions. Tests and production build passed on develop. Review this PR and merge it to trigger the production deployment."
